<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-secondary-fixed-dim rounded-full blur-[120px] opacity-30 mix-blend-multiply"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-tertiary-fixed-dim rounded-full blur-[100px] opacity-20 mix-blend-multiply"></div>
</div>

<main class="flex-grow flex flex-col items-center justify-center p-container-padding z-10 w-full max-w-[600px] mx-auto min-h-screen">
<!-- Header Section -->
<header class="text-center mb-stack-lg w-full">
<!-- Gentle Icon -->
<div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-secondary-container/20 text-secondary mb-stack-md shadow-[0_8px_32px_rgba(253,170,141,0.15)]">
<span class="material-symbols-outlined text-[48px] icon-filled">air</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-stack-sm md:hidden font-headline-lg-mobile text-headline-lg-mobile">
                Every breath is a new beginning.
            </h1>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-stack-sm hidden md:block">
                Every breath is a new beginning.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">
                One slip-up doesn't erase your progress. Your <strong class="text-secondary font-600">5 clean days</strong> are still yours.
            </p>
</header>
<!-- Action Cards (Bento Style) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter w-full max-w-lg mb-stack-lg">
<!-- Log and Breathe Card -->
<button class="flex flex-col items-start p-container-padding bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(253,170,141,0.06)] hover:bg-surface-container-lowest/80 hover:scale-[0.98] transition-all duration-300 text-left group">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary mb-stack-sm group-hover:bg-secondary-container/50 transition-colors">
<span class="material-symbols-outlined">edit_note</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-base">Log &amp; Breathe</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Note what happened to understand your triggers, then take a deep breath.</p>
</button>
<!-- Support Tip Card -->
<button class="flex flex-col items-start p-container-padding bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(91,174,165,0.06)] hover:bg-surface-container-lowest/80 hover:scale-[0.98] transition-all duration-300 text-left group">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center text-primary mb-stack-sm group-hover:bg-primary-container/40 transition-colors">
<span class="material-symbols-outlined">favorite</span>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-base">Get a Tip</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Read a gentle, supportive tip to help you refocus your energy.</p>
</button>
</div>

<button class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors py-2 px-4 rounded-full">
            I just need a moment
