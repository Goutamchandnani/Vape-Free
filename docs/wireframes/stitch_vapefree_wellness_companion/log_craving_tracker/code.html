</button>

<script>
        // Trigger Chip Selection Logic
        const chips = document.querySelectorAll('.trigger-chip');
        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                this.classList.toggle('chip-selected');
                
                // Animate icon if selected
                const icon = this.querySelector('.material-symbols-outlined');
                if(this.classList.contains('chip-selected')) {
                    icon.style.fontVariationSettings = "'FILL' 1";
                    icon.style.transform = "scale(1.1)";
                    setTimeout(() => icon.style.transform = "scale(1)", 150);
                } else {
                    icon.style.fontVariationSettings = "'FILL' 0";
                }
            });
        });

        // Main Log Button Ripple Effect
        const logBtn = document.getElementById('logBtn');
        const rippleContainer = document.getElementById('rippleContainer');

        logBtn.addEventListener('click', function(e) {
            const circle = document.createElement('div');
            const diameter = Math.max(this.clientWidth, this.clientHeight);
            const radius = diameter / 2;

            const rect = this.getBoundingClientRect();
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            
            circle.classList.add('absolute', 'bg-white', 'opacity-30', 'rounded-full', 'scale-0', 'transition-transform', 'duration-500', 'ease-out');
            
            rippleContainer.appendChild(circle);

            // Force reflow
            void circle.offsetWidth;
            
            circle.classList.remove('scale-0');
            circle.classList.add('scale-150', 'opacity-0');

            setTimeout(() => {
                circle.remove();
            }, 500);
        });
    </script>
