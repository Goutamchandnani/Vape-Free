<style>
        .circular-progress {
            stroke-dasharray: 100;
            stroke-dashoffset: 40; /* Represents 60% completion (12/20) */
            transition: stroke-dashoffset 0.5s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-6">
<!-- Widget Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(91,174,165,0.08)] p-6 w-full max-w-sm flex flex-col gap-6 relative overflow-hidden">
<!-- Ambient subtle background glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-container rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<!-- Header: Days Clean -->
<div class="flex items-center justify-between z-10">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Milestone</p>
<h2 class="font-headline-md text-headline-md text-primary">5 Days Clean</h2>
</div>
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
</div>
<!-- Today's Progress & Quick Action -->
<div class="flex items-center justify-between z-10 bg-surface-container rounded-lg p-4">
<div class="flex items-center gap-4">
<!-- Circular Progress Bar -->
<div class="relative w-14 h-14">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
<!-- Background Circle -->
<path class="text-surface-variant" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<!-- Progress Circle -->
<path class="circular-progress text-primary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
</svg>
<!-- Center Text -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-label-md text-label-md text-on-surface">60%</span>
</div>
</div>
<!-- Text Info -->
<div>
<p class="font-body-md text-body-md text-on-surface-variant">Today</p>
<p class="font-label-md text-label-md text-on-surface"><span class="text-primary font-bold">12</span> / 20 puffs</p>
</div>
</div>
<!-- Quick Action Button -->
<button class="w-12 h-12 bg-primary text-on-primary rounded-full flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-md group">
<span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-300">add</span>
</button>
</div>
<!-- Supportive Message -->
<div class="z-10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant italic">"You're doing great, keep breathing."</p>
</div>
</div>
